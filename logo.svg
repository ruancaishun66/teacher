<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="顺势标识：云山与变脸面具">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b344d"/>
      <stop offset="1" stop-color="#0e1c2c"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff6e6" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#fff6e6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 印章底 -->
  <rect x="4" y="4" width="88" height="88" rx="20" fill="url(#sky)" stroke="#c4544d" stroke-width="4"/>
  <rect x="10.5" y="10.5" width="75" height="75" rx="14.5" fill="none" stroke="#fff6e6" stroke-opacity=".38" stroke-width="1.2"/>

  <!-- 远山与云气 -->
  <path d="M13 70 L33 38 L45 56 L58 33 L83 70 Z" fill="#2f5d8a" opacity=".95"/>
  <path d="M11 74 L29 51 L41 65 L52 47 L74 74 Z" fill="#162d46"/>
  <path d="M13 62 Q25 55 37 61 T61 61 T84 58" fill="none" stroke="url(#mist)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M17 70 Q30 63 44 69 T71 68" fill="none" stroke="url(#mist)" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>

  <!-- 变脸面具：左红右蓝 -->
  <path d="M48 18 C37.5 18 33 24.5 33 33.5 C33 46 39.5 58 48 63.5 C56.5 58 63 46 63 33.5 C63 24.5 58.5 18 48 18 Z" fill="#c4544d"/>
  <path d="M48 18 C58.5 18 63 24.5 63 33.5 C63 46 56.5 58 48 63.5 Z" fill="#315f8c"/>
  <path d="M48 18 C37.5 18 33 24.5 33 33.5 C33 46 39.5 58 48 63.5 C56.5 58 63 46 63 33.5 C63 24.5 58.5 18 48 18 Z" fill="none" stroke="#fff6e6" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M48 18.8 V62.6" stroke="#fff6e6" stroke-width="1.1" opacity=".75"/>

  <!-- 额间云纹 -->
  <path d="M48 21.5 L51.5 26 L48 30.5 L44.5 26 Z" fill="#d6a74b" stroke="#fff6e6" stroke-width=".8"/>
  <path d="M40 27.5 Q44 24.5 47 27.5" fill="none" stroke="#fff6e6" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
  <path d="M56 27.5 Q52 24.5 49 27.5" fill="none" stroke="#fff6e6" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>

  <!-- 眼与眉 -->
  <path d="M38 36.5 Q42 32 46 36.5 Q42 40.5 38 36.5 Z" fill="#0e1c2c"/>
  <path d="M50 36.5 Q54 32 58 36.5 Q54 40.5 50 36.5 Z" fill="#0e1c2c"/>
  <path d="M37.5 31.5 Q42 28.8 46.5 31" fill="none" stroke="#fff6e6" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M49.5 31 Q54 28.8 58.5 31.5" fill="none" stroke="#fff6e6" stroke-width="1.3" stroke-linecap="round"/>

  <!-- 鼻与口 -->
  <path d="M48 39 L46.5 47 L48 49" fill="none" stroke="#fff6e6" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <path d="M42.5 52 Q48 56.5 53.5 52 Q48 59 42.5 52 Z" fill="#0e1c2c" stroke="#fff6e6" stroke-width="1" stroke-linejoin="round"/>

  <!-- 颊侧云勾 -->
  <path d="M36 44 Q38.5 46 36.5 49" fill="none" stroke="#d6a74b" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M60 44 Q57.5 46 59.5 49" fill="none" stroke="#d6a74b" stroke-width="1.2" stroke-linecap="round"/>

  <!-- 底部云带 -->
  <path d="M22 78 Q32 73.5 42 78 T62 78 T78 76" fill="none" stroke="url(#mist)" stroke-width="2.6" stroke-linecap="round"/>
</svg>
